# evcc-configuratie (overstap EVA → evcc, stap 1)
#
# Deze configuratie LEEST de P1-meter (net), de GoodWe (batterij) en de zonnepanelen via de IoTaWatt.
# De GoodWe (batterij) wordt NIET via het standaard-sjabloon "goodwe-hybrid"
# gekoppeld (dat kan de batterij aansturen), maar via losse registers die evcc
# enkel kan lezen: EVA blijft voorlopig de baas over de batterij.
# De laadpaal wordt wel door evcc aangestuurd (onderaan, stap 1).
#
# Aanpassen:
#   192.168.0.GGG  = IP-adres van de GoodWe   (2 keer)
#   192.168.0.III  = IP-adres van de IoTaWatt (1 keer)
#   192.168.0.LLL  = IP-adres van de laadpaal (1 keer)
#   192.168.0.PPP  = IP-adres van de HomeWizard P1-meter (1 keer)
#   192.168.0.HHH  = IP-adres van de HeishaMon (2 keer)
#   PV1 / PV2      = namen van de zonnepaneel-kanalen in de IoTaWatt

interval: 30s
log: info

network:
  port: 7070

meters:
  # Netmeter: HomeWizard P1-meter op de digitale meter van Fluvius (officiële waarden, alleen lezen).
  # Lokale API moet aanstaan in de HomeWizard Energy-app.
  - name: grid
    type: template
    template: homewizard
    usage: grid
    host: 192.168.0.PPP

  # Batterij: vermogen (+ = ontladen, - = laden) en laadtoestand.
  - name: battery
    type: custom
    power:
      source: modbus
      uri: 192.168.0.GGG:502
      id: 247
      register:
        address: 35182 # batterijvermogen
        type: holding
        decode: int32
    soc:
      source: modbus
      uri: 192.168.0.GGG:502
      id: 247
      register:
        address: 37007 # laadtoestand %
        type: holding
        decode: uint16

  # Zonnepanelen: uit de IoTaWatt (de GoodWe BT heeft zelf geen panelen).
  # Het teken van elk kanaal wordt genegeerd (absolute waarde).
  - name: pv
    type: custom
    power:
      source: http
      uri: "http://192.168.0.III/query?select=[PV1.watts,PV2.watts]&begin=s-10s&end=s&group=all&format=json"
      jq: "[.[0][] | if . == null then 0 elif . < 0 then -. else . end] | add"

  # Warmtepomp via de HeishaMon (alleen lezen). evcc bewaart zo de geschiedenis van het
  # elektrisch verbruik en de geleverde warmte; de Stroom-app berekent daaruit de COP.
  - name: wp_elektrisch
    type: custom
    power:
      source: http
      uri: http://192.168.0.HHH/json
      jq: '[.heatpump[] | select(.Name | test("_Power_Consumption$")) | .Value] | add'
      cache: 5s
  - name: wp_warmte
    type: custom
    power:
      source: http
      uri: http://192.168.0.HHH/json
      jq: '[.heatpump[] | select(.Name | test("_Power_Production$")) | .Value] | add'
      cache: 5s

site:
  title: Thuis
  meters:
    grid: grid
    pv:
      - pv
    battery:
      - battery
    ext:
      - wp_elektrisch
      - wp_warmte

# ---------------------------------------------------------------------------
# STAP 1 van de overstap EVA → evcc: de laadpaal + kwartierpiek-grens
# ---------------------------------------------------------------------------

# Laadpaal RAEDIAN NEX via Modbus TCP. evcc STUURT deze laadpaal aan
# (starten/stoppen en laadstroom), de batterij blijft voorlopig bij EVA.
chargers:
  - name: raedian
    type: template
    template: raedian
    modbus: tcpip
    host: 192.168.0.LLL
    port: 502
    id: 1

  # Sanitair warm water op zonne-overschot (stap 4). evcc zet het boilerdoel van de warmtepomp
  # via de HeishaMon tijdelijk op 60 °C ("aan") en daarna terug op 48 °C ("uit").
  # 48 = je gewone boilertemperatuur, 60 = de temperatuur bij zonne-overschot.
  - name: boiler
    type: switchsocket
    features:
      - heating
      - integrateddevice
      - switchdevice
    standbypower: 20 # W, daarboven warmt de warmtepomp de boiler echt op
    enabled:
      source: http
      uri: http://192.168.0.HHH/json
      jq: '[.heatpump[] | select(.Name == "DHW_Target_Temp") | .Value][0] >= 55'
      cache: 5s
    enable:
      source: http
      uri: 'http://192.168.0.HHH/command?SetDHWTemp={{ if .enable }}60{{ else }}48{{ end }}'
    power:
      source: http
      uri: http://192.168.0.HHH/json
      jq: '[.heatpump[] | select(.Name == "DHW_Power_Consumption") | .Value][0]'
      cache: 5s
    temp:
      source: http
      uri: http://192.168.0.HHH/json
      jq: '[.heatpump[] | select(.Name == "DHW_Temp") | .Value][0]'
      cache: 5s

# Kwartierpiek beperken: evcc kijkt naar de P1-meter (grid) en laat de auto
# nooit zo snel laden dat het hele huis samen boven maxPower uitkomt.
# Het capaciteitstarief rekent met het gemiddelde per kwartier, dus als het
# vermogen nooit boven de grens gaat, gaat ook je kwartierpiek er niet boven.
circuits:
  - name: aansluiting
    title: Kwartierpiek-grens
    meter: grid
    maxPower: 5000 # W  <-- je gewenste maximale kwartierpiek (bv. 4000-6000)

loadpoints:
  - title: Laadpaal
    charger: raedian
    circuit: aansluiting
    mode: pv       # "Zon": alleen laden met zonne-overschot ("Snel" kan altijd in het evcc-scherm)
    priority: 2    # overschot eerst naar de auto, daarna naar de boiler (hoger = eerst)
    # Min. en max. laadstroom (6 A / 16 A) stel je in het evcc-scherm in: Laadpaal → ⚙︎.

  # Boiler: krijgt het overschot dat de batterij en de auto niet gebruiken.
  - title: Boiler
    charger: boiler
    mode: pv       # "Zon": boiler naar 60 °C als er genoeg zonne-overschot is
    priority: 1

# Stap 2 – dynamisch tarief van Bolt (pas vanaf 1 november!).
# Haal op 1 november het #-teken weg voor de 5 regels hieronder en Run de taak opnieuw.
# Daarna kun je bij de laadpaal "goedkoop laden" instellen en toont evcc de kostprijs per laadbeurt.
# tariffs:
#   grid:
#     type: template
#     template: epexprijzen-be
#     provider: bolt
#     region: vlaanderen

# ---------------------------------------------------------------------------
# STAP 3 (VOORBEREIDING, NOG NIET ACTIVEREN): de batterij van EVA naar evcc
# ---------------------------------------------------------------------------
# Pas als EVA de batterij NIET meer aanstuurt (installateur), mag evcc dat doen.
# Twee systemen die tegelijk de batterijmodus van de GoodWe schrijven, werken elkaar tegen.
# Dan: vervang hierboven de meter "battery" (type custom) door dit blok (zonder #-tekens):
#
#  - name: battery
#    type: template
#    template: goodwe-hybrid
#    usage: battery
#    modbus: tcpip
#    host: 192.168.0.GGG
#    port: 502
#    id: 247
#    maxacpower: 8000        # GW8K-BT: 8 kW
#    capacity: 10            # kWh  <-- capaciteit van je batterij nakijken
#    maxchargepower: 5000    # W, laden van het net (goedkope uren, dynamisch tarief)
#    minsoc: 10              # %, nooit dieper ontladen
#
# evcc kan dan:
#   - de batterij niet laten leeglopen in de auto ("batterij vasthouden" tijdens snel laden),
#   - de batterij laden van het net bij goedkope Bolt-prijzen,
#   - en de batterij blijft eerst gevuld worden met zonne-overschot (instelling in het evcc-scherm).
