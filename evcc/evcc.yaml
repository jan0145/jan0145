# evcc-configuratie (overstap EVA → evcc, stap 1)
#
# Deze configuratie LEEST de P1-meter (net), de GoodWe (batterij) en de zonnepanelen via de IoTaWatt.
# De GoodWe (batterij) wordt NIET via het standaard-sjabloon "goodwe-hybrid"
# gekoppeld (dat kan de batterij aansturen), maar via losse registers die evcc
# enkel kan lezen: EVA blijft voorlopig de baas over de batterij.
# De laadpaal wordt wel door evcc aangestuurd (onderaan, stap 1).
#
# Aanpassen:
#   192.168.0.GGG  = IP-adres van de GoodWe   (2 keer)
#   192.168.0.III  = IP-adres van de IoTaWatt (1 keer)
#   192.168.0.LLL  = IP-adres van de laadpaal (1 keer)
#   192.168.0.PPP  = IP-adres van de HomeWizard P1-meter (1 keer)
#   PV1 / PV2      = namen van de zonnepaneel-kanalen in de IoTaWatt

interval: 30s
log: info

network:
  port: 7070

meters:
  # Netmeter: HomeWizard P1-meter op de digitale meter van Fluvius (officiële waarden, alleen lezen).
  # Lokale API moet aanstaan in de HomeWizard Energy-app.
  - name: grid
    type: template
    template: homewizard
    usage: grid
    host: 192.168.0.PPP

  # Batterij: vermogen (+ = ontladen, - = laden) en laadtoestand.
  - name: battery
    type: custom
    power:
      source: modbus
      uri: 192.168.0.GGG:502
      id: 247
      register:
        address: 35182 # batterijvermogen
        type: holding
        decode: int32
    soc:
      source: modbus
      uri: 192.168.0.GGG:502
      id: 247
      register:
        address: 37007 # laadtoestand %
        type: holding
        decode: uint16

  # Zonnepanelen: uit de IoTaWatt (de GoodWe BT heeft zelf geen panelen).
  # Het teken van elk kanaal wordt genegeerd (absolute waarde).
  - name: pv
    type: custom
    power:
      source: http
      uri: "http://192.168.0.III/query?select=[PV1.watts,PV2.watts]&begin=s-10s&end=s&group=all&format=json"
      jq: "[.[0][] | if . == null then 0 elif . < 0 then -. else . end] | add"

site:
  title: Thuis
  meters:
    grid: grid
    pv:
      - pv
    battery:
      - battery

# ---------------------------------------------------------------------------
# STAP 1 van de overstap EVA → evcc: de laadpaal + kwartierpiek-grens
# ---------------------------------------------------------------------------

# Laadpaal RAEDIAN NEX via Modbus TCP. evcc STUURT deze laadpaal aan
# (starten/stoppen en laadstroom), de batterij blijft voorlopig bij EVA.
chargers:
  - name: raedian
    type: template
    template: raedian
    modbus: tcpip
    host: 192.168.0.LLL
    port: 502
    id: 1

# Kwartierpiek beperken: evcc kijkt naar de P1-meter (grid) en laat de auto
# nooit zo snel laden dat het hele huis samen boven maxPower uitkomt.
# Het capaciteitstarief rekent met het gemiddelde per kwartier, dus als het
# vermogen nooit boven de grens gaat, gaat ook je kwartierpiek er niet boven.
circuits:
  - name: aansluiting
    title: Kwartierpiek-grens
    meter: grid
    maxPower: 5000 # W  <-- je gewenste maximale kwartierpiek (bv. 4000-6000)

loadpoints:
  - title: Laadpaal
    charger: raedian
    circuit: aansluiting
    mode: now      # "Snel": laden zodra de auto ingeplugd is, maar binnen de grens
    # Min. en max. laadstroom (6 A / 16 A) stel je in het evcc-scherm in: Laadpaal → ⚙︎.
