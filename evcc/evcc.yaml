# evcc – alleen uitlezen (read-only)
#
# Deze configuratie LEEST de P1-meter (net), de GoodWe (batterij) en de zonnepanelen via de IoTaWatt.
# Er staat bewust geen enkele schrijfopdracht in: de GoodWe wordt niet via het
# standaard-sjabloon "goodwe-hybrid" gekoppeld (dat kan de batterij en de
# teruglevering aansturen), maar via losse registers die evcc enkel kan lezen.
# EVA blijft dus de baas over de batterij.
#
# Aanpassen:
#   192.168.0.GGG  = IP-adres van de GoodWe   (2 keer)
#   192.168.0.III  = IP-adres van de IoTaWatt (1 keer)
#   192.168.0.LLL  = IP-adres van de laadpaal (1 keer)
#   192.168.0.PPP  = IP-adres van de HomeWizard P1-meter (1 keer)
#   PV1 / PV2      = namen van de zonnepaneel-kanalen in de IoTaWatt

interval: 30s
log: info

network:
  port: 7070

meters:
  # Netmeter: HomeWizard P1-meter op de digitale meter van Fluvius (officiële waarden, alleen lezen).
  # Lokale API moet aanstaan in de HomeWizard Energy-app.
  - name: grid
    type: template
    template: homewizard
    usage: grid
    host: 192.168.0.PPP

  # Batterij: vermogen (+ = ontladen, - = laden) en laadtoestand.
  - name: battery
    type: custom
    power:
      source: modbus
      uri: 192.168.0.GGG:502
      id: 247
      register:
        address: 35182 # batterijvermogen
        type: holding
        decode: int32
    soc:
      source: modbus
      uri: 192.168.0.GGG:502
      id: 247
      register:
        address: 37007 # laadtoestand %
        type: holding
        decode: uint16

  # Zonnepanelen: uit de IoTaWatt (de GoodWe BT heeft zelf geen panelen).
  # Het teken van elk kanaal wordt genegeerd (absolute waarde).
  - name: pv
    type: custom
    power:
      source: http
      uri: "http://192.168.0.III/query?select=[PV1.watts,PV2.watts]&begin=s-10s&end=s&group=all&format=json"
      jq: "[.[0][] | if . == null then 0 elif . < 0 then -. else . end] | add"

  # Laadpaal RAEDIAN NEX via Modbus TCP: alleen uitlezen (laadvermogen).
  # Geen energieteller: die van de laadpaal begint per sessie opnieuw; evcc rekent de kWh zelf uit.
  # Bewust GEEN charger/loadpoint: dan zou evcc de laadpaal aansturen.
  - name: laadpaal
    type: custom
    power:
      source: modbus
      uri: 192.168.0.LLL:502
      id: 1
      register:
        address: 32796 # 0x801C laadvermogen (W)
        type: holding
        decode: uint32

site:
  title: Thuis
  meters:
    grid: grid
    pv:
      - pv
    battery:
      - battery
    ext:
      - laadpaal # alleen tonen, telt niet mee in de regeling
